name: EAS Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - cambridge-paper-tracker/**
jobs:
  build:
    name: Build Android preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup EAS
        uses: expo/expo-github-action@main
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci
        working-directory: ./cambridge-paper-tracker

      - name: Build app
        run: eas build --platform android --profile preview --non-interactive
        working-directory: ./cambridge-paper-tracker
        env:
          EXPO_PUBLIC_API_URL: https://cambridgepapertracker.duckdns.org/api